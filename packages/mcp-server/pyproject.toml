[project]
name = "astrbot-gateway-mcp"
version = "0.1.0"
description = "MCP tool surface for AstrBot-Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["astrbot-gateway-sdk>=0.1.0", "mcp>=1.0,<2"]

[project.scripts]
astrbot-gateway-mcp = "astrbot_gateway_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrbot_gateway_mcp"]
