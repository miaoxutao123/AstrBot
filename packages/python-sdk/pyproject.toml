[project]
name = "astrbot-gateway-sdk"
version = "0.1.0"
description = "Async Python client for the AstrBot-Gateway public wire protocol"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=15.0,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrbot_gateway_sdk"]
