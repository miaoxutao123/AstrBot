[project]
name = "astrbot-gateway-agent"
version = "0.1.0"
description = "Universal Agent Bridge for AstrBot-Gateway"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["astrbot-gateway-sdk>=0.1.0", "httpx>=0.27,<1", "PyYAML>=6,<7"]

[project.scripts]
astrbot-gateway-agent = "astrbot_gateway_agent.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/astrbot_gateway_agent"]
