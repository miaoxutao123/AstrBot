name: Gateway CI

on:
  push:
    paths:
      - 'gateway/**'
      - 'packages/python-sdk/**'
      - 'examples/python_echo_agent.py'
      - '.github/workflows/gateway-ci.yml'
  pull_request:
    paths:
      - 'gateway/**'
      - 'packages/python-sdk/**'
      - 'examples/python_echo_agent.py'
      - '.github/workflows/gateway-ci.yml'
  workflow_dispatch:

defaults:
  run:
    working-directory: gateway

jobs:
  quality:
    name: Quality / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run mypy
      - run: uv run pyright -p pyproject.toml

  core:
    name: Core / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync
      - run: >-
          uv run pytest -q
          tests/core tests/profiles tests/media tests/state tests/secrets tests/config
          tests/fake_adapters tests/architecture

  api:
    name: API / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync
      - run: uv run pytest -q tests/api

  adapter-contract:
    name: Adapter contract / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync
      - run: uv run pytest -q tests/contract

  onebot:
    name: OneBot / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra onebot
      - run: uv run pytest -q tests/adapters/onebot

  telegram:
    name: Telegram / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra telegram
      - run: uv run pytest -q tests/adapters/telegram

  weixin:
    name: Weixin / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra weixin
      - run: uv run pytest -q tests/adapters/weixin

  satori:
    name: Satori / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra satori
      - run: uv run pytest -q tests/adapters/satori tests/contract

  qq-official:
    name: QQ Official / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra qq_official
      - run: uv run pytest -q tests/adapters/qq_official tests/contract

  sdk:
    name: Python SDK / Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.10', '3.13']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install --upgrade uv
      - run: uv sync --extra api
      - run: >-
          PYTHONPATH=../packages/python-sdk/src
          uv run pytest -q tests/sdk
      - run: >-
          PYTHONPATH=../packages/python-sdk/src
          uv run pytest -q -o asyncio_mode=auto ../packages/python-sdk/tests
      - run: uv run ruff check ../packages/python-sdk ../examples/python_echo_agent.py
