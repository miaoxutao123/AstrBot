[project]
name = "agent-transport-gateway"
version = "0.1.0"
description = "A lightweight extensible I/O and transport gateway for external agents"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = []

[project.optional-dependencies]
api = [
  "fastapi>=0.124.0,<1",
  "uvicorn[standard]>=0.30.0",
]

[dependency-groups]
dev = [
  "fastapi>=0.124.0,<1",
  "httpx2>=2.12.0",
  "mypy>=1.18.0",
  "pyright>=1.1.400",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff==0.15.22",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ASYNC", "C4", "E", "F", "I", "Q", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["gateway", "tests"]
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["gateway", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportMissingTypeStubs = false
