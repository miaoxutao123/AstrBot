[project]
name = "astrbot-gateway"
version = "0.5.1"
description = "A lightweight extensible I/O and transport gateway for external agents"
readme = "README.md"
license = { text = "AGPL-3.0-or-later" }
requires-python = ">=3.10"
dependencies = [
  "pycryptodome>=3.21.0,<4",
  "PyYAML>=6.0.2,<7",
]

[project.optional-dependencies]
api = [
  "fastapi>=0.124.0,<1",
  "python-multipart>=0.0.20",
  "uvicorn[standard]>=0.30.0",
]
onebot = [
  "aiocqhttp>=1.4.4,<2",
  "aiohttp>=3.10.0,<4",
]
telegram = [
  "python-telegram-bot>=22.6,<23",
]
weixin = [
  "aiohttp>=3.10.0,<4",
]
satori = [
  "aiohttp>=3.10.0,<4",
  "websockets>=15.0,<16",
]
qq_official = [
  "aiohttp>=3.10.0,<4",
  "websockets>=15.0,<16",
]
all = [
  "aiocqhttp>=1.4.4,<2",
  "aiohttp>=3.10.0,<4",
  "fastapi>=0.124.0,<1",
  "python-multipart>=0.0.20",
  "python-telegram-bot>=22.6,<23",
  "uvicorn[standard]>=0.30.0",
  "websockets>=15.0,<16",
]

[project.scripts]
astrbot-gateway = "gateway.cli:main"

[project.entry-points."astrbot_gateway.adapters"]
onebot = "gateway.adapters.onebot:OneBotAdapter"
telegram = "gateway.adapters.telegram:TelegramAdapter"
weixin = "gateway.adapters.weixin:WeixinAdapter"
satori = "gateway.adapters.satori:SatoriAdapter"
qq_official = "gateway.adapters.qq_official:QQOfficialWebSocketAdapter"

[dependency-groups]
dev = [
  "aiocqhttp>=1.4.4,<2",
  "aiohttp>=3.10.0,<4",
  "fastapi>=0.124.0,<1",
  "httpx2>=2.12.0",
  "python-multipart>=0.0.20",
  "python-telegram-bot>=22.6,<23",
  "PyYAML>=6.0.2,<7",
  "mypy>=1.18.0",
  "pyright>=1.1.400",
  "pytest>=8.4.1",
  "pytest-asyncio>=1.1.0",
  "ruff==0.15.22",
  "types-PyYAML>=6.0.12.20250822",
  "uvicorn[standard]>=0.30.0",
  "websockets>=15.0,<16",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["gateway"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["ASYNC", "C4", "E", "F", "I", "Q", "UP", "W"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["gateway", "tests"]
plugins = ["pydantic.mypy"]

[tool.pyright]
include = ["gateway", "tests"]
pythonVersion = "3.10"
typeCheckingMode = "basic"
venvPath = "."
venv = ".venv"
reportMissingImports = false
reportMissingTypeStubs = false
