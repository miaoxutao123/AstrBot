server:
  host: 127.0.0.1
  port: 6186

state:
  type: sqlite
  path: data/gateway-state.db

secrets:
  type: encrypted_file
  path: data/gateway-secrets.json

media:
  type: file
  path: data/media
  max_upload_size: 20971520
  ttl_seconds: 3600

adapters:
  - id: qq-main
    type: onebot
    enabled: true
    config:
      mode: websocket
      endpoint: ws://127.0.0.1:3001
      token:
        env: ONEBOT_TOKEN
  - id: telegram-main
    type: telegram
    enabled: false
    config:
      token:
        env: TELEGRAM_BOT_TOKEN
      polling_timeout: 30
      reconnect_max_delay: 30
  - id: weixin-main
    type: weixin
    enabled: false
    config:
      base_url: https://ilinkai.weixin.qq.com
      cdn_base_url: https://novac2c.cdn.weixin.qq.com/c2c
      qr_poll_interval: 1
      long_poll_timeout: 35
      reconnect_max_delay: 30

api:
  keys:
    - id: local-agent
      secret:
        env: GATEWAY_API_KEY
      scopes:
        - events:read
        - commands:send
        - adapters:read
        - adapters:manage
        - media:read
        - media:write
